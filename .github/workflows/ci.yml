name: ci

on:
  pull_request:
  push:
    branches: [dev, stage, prod]

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: cmake --preset asan -DPUMPKIN_WERROR=ON
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  ci:
    if: always()
    needs: [format, build]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.format.result }}" = "success" && test "${{ needs.build.result }}" = "success"
